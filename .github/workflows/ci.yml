name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "29.1.2"

jobs:
  # The repo's own build gate: compile with warnings as errors and check formatting.
  precommit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: dev-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix precommit

  # The end-to-end suite (real server, shipper, Oban, Postgres): on pull requests,
  # weekly and on demand. Informational; it is not meant as a required check.
  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 20
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: test-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix test

  # The Docker Compose quick start from the README: build, start, wait for health and mint
  # a token. Informational, like e2e; it is not meant as a required check.
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Write a throwaway .env
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s|^SECRET_KEY_BASE=.*|SECRET_KEY_BASE=$(openssl rand -base64 48 | tr -d '/+=\n')|" .env
      - run: docker compose up -d --build
      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4000/health && exit 0
            sleep 5
          done
          docker compose logs app
          exit 1
      - name: Mint a token as the README does
        run: >-
          docker compose exec -T app bin/context_archive rpc
          'ContextArchive.Release.mint(name: "smoke", kind: "read", scopes: "agents", out: "/data/tokens/smoke.token")'
      - if: always()
        run: docker compose down -v
